apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod

namePrefix: collections-tree-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: collections-tree

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/shopify-collections-tree-app
    digest: sha256:f42ec06a2d6f3fe34d84d3a16a1386164fe34ada084d070159d5918c3e0e3a6c

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: harbor-pull
            containers:
              - name: app
                command: ["/bin/sh", "-c"]
                args:
                  - npx prisma generate && npx prisma migrate deploy && exec ./node_modules/.bin/remix-serve ./build/server/index.js
                env:
                  - { name: PORT, value: "3473" }
                  # Override the framework base's generic SCOPES (read_products,write_products):
                  # as a direct env var it shadows the real scopes from collections-tree-secrets
                  # (envFrom). Must match k8s/expected-scopes.txt (guarded by scripts/verify-scopes.sh).
                  - { name: SCOPES, value: "read_products,write_products,read_content,read_themes" }
                  - { name: DEV_MODE, value: "" }
                  - { name: LIVE_BRAIN, value: "" }
                  - { name: LIVE_SHOPIFY_WRITES, value: "" }
                  - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/collections-tree" }
                  - { name: STOREFRONT_DOMAIN, value: "www.skirmshop.es" }
                  - { name: BRAIN_URL, value: "http://skirmshop-brain.skirmshop-brain-prod.svc.cluster.local" }
                  - name: BRAIN_API_KEY
                    valueFrom: { secretKeyRef: { name: rag-secrets, key: BRAIN_API_KEY } }
                  - { name: LLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000/v1" }
                  # Override the shared DB name (base default is `skirmshop`).
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  # connection_limit: sin él Prisma dimensiona el pool con
                  # `cpus_fisicos * 2 + 1` LEIDO DEL HOST, no del límite del
                  # contenedor. En `sauvage` (48 vCPU, sin cpu limit) eso son ~49
                  # conexiones por PrismaClient, y el framework instancia uno
                  # además del de la app → pool efectivo x2. Con 1 réplica y
                  # ~1 query concurrente, 5 por cliente (10/pod) sobra.
                  # application_name: trazabilidad en pg_stat_activity.
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/collections_tree?connection_limit=5&pool_timeout=15&connect_timeout=10&application_name=collections-tree-app" }
                  # Scoped RMQ user (configure/read: events + collections-tree.*;
                  # write: collections-tree.*) — replaces the broker admin creds.
                  - name: _RMQUSER
                    valueFrom: { secretKeyRef: { name: collections-tree-rmq, key: username } }
                  - name: _RMQPASS
                    valueFrom: { secretKeyRef: { name: collections-tree-rmq, key: password } }
                  - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
                  - { name: SYNAPSE_TENANT, value: "skirmshop" }
                  - { name: SYNAPSE_EVENTS_EXCHANGE, value: "events" }
                  - { name: S3_ENDPOINT, value: "http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000" }
                  - { name: S3_BUCKET, value: "skirmshop-drive" }
                  - { name: S3_REGION, value: "us-east-1" }
                  - { name: S3_PREFIX, value: "catalog/exports" }
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_ACCESS_KEY_ID } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_SECRET_ACCESS_KEY } }
                envFrom:
                  - secretRef: { name: collections-tree-secrets }
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { memory: 1Gi }
                readinessProbe:
                  initialDelaySeconds: 30
                livenessProbe:
                  tcpSocket: { port: http }
                  initialDelaySeconds: 90
                  periodSeconds: 20
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3473
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`skirmshop.e-dani.com`) && PathPrefix(`/collections-tree`)
