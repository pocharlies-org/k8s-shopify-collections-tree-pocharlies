apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod

namePrefix: collections-tree-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: collections-tree

images:
  - name: shopify-app
    newName: harbor.lan.e-dani.com/homelab/shopify-collections-tree-app
    digest: sha256:63a776f4af3947e88ba695490cf66440b596265abbc3f4772937c57c97f28cfa

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: harbor-pull
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3473" }
                  - { name: DEV_MODE, value: "" }
                  - { name: LIVE_BRAIN, value: "" }
                  - { name: LIVE_SHOPIFY_WRITES, value: "" }
                  - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/collections-tree" }
                  - { name: STOREFRONT_DOMAIN, value: "www.skirmshop.es" }
                  - { name: BRAIN_URL, value: "http://skirmshop-brain.skirmshop-brain-prod.svc.cluster.local" }
                  - { name: LLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000/v1" }
                  # Override the shared DB name (base default is `skirmshop`).
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/collections_tree" }
                  - name: _RMQUSER
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
                  - name: _RMQPASS
                    valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
                  - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
                  - { name: SYNAPSE_TENANT, value: "skirmshop" }
                  - { name: SYNAPSE_EVENTS_EXCHANGE, value: "events" }
                envFrom:
                  - secretRef: { name: collections-tree-secrets }
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { memory: 1Gi }
                readinessProbe:
                  initialDelaySeconds: 30
                livenessProbe:
                  tcpSocket: { port: http }
                  initialDelaySeconds: 90
                  periodSeconds: 20
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3473
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`skirmshop.e-dani.com`) && PathPrefix(`/collections-tree`)
