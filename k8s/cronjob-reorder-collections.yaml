apiVersion: batch/v1
kind: CronJob
metadata:
  name: reorder-collections
  labels:
    app.kubernetes.io/name: reorder-collections
spec:
  # Reordenador de colecciones (SKIRM-451): ventas de los últimos 90 días desc →
  # precio desc → agotados al final. Deseado-estado: relanzar converge, por eso
  # basta un disparo diario. La regla la fijó Dani el 10-11 (todas las
  # colecciones entran, incluidos los órdenes manuales previos).
  schedule: "0 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Barrido de ~970 colecciones + pedidos de 90 días. Se ajustará tras medir
      # el dry-run completo (el plan del architect lo exige antes de activar).
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reorder-collections
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # Misma colocación que el pod de la app (imagen ya cacheada ahí).
          nodeSelector:
            role: edge
            kubernetes.io/arch: amd64
          tolerations:
            - key: role
              operator: Equal
              value: edge
              effect: NoSchedule
          imagePullSecrets:
            - name: harbor-pull
          containers:
            - name: reorder
              # La misma imagen de la app (kustomization `images:` fija el
              # digest) solo para un node fetch al servicio interno.
              image: shopify-app
              imagePullPolicy: IfNotPresent
              command:
                - node
                - -e
                - |
                  const url = 'http://collections-tree-app/api/admin/collections/reorder';
                  const token = process.env.REORDER_API_TOKEN;
                  if (!token) { console.error('REORDER_API_TOKEN missing'); process.exit(1); }
                  const ctrl = new AbortController();
                  // 55min: por debajo de activeDeadlineSeconds (3600s).
                  const t = setTimeout(() => ctrl.abort(), 55 * 60 * 1000);
                  try {
                    const res = await fetch(url, {
                      method: 'POST',
                      headers: { authorization: `Bearer ${token}` },
                      signal: ctrl.signal,
                    });
                    const body = await res.text();
                    console.log(res.status, body.slice(0, 500));
                    if (!res.ok) process.exit(1);
                  } finally {
                    clearTimeout(t);
                  }
              envFrom:
                - secretRef: { name: collections-tree-secrets }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
