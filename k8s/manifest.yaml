apiVersion: apps/v1
kind: Deployment
metadata:
  name: collections-tree-app
  namespace: skirmshop
spec:
  replicas: 1
  selector: { matchLabels: { app: collections-tree-app } }
  template:
    metadata: { labels: { app: collections-tree-app } }
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector: { role: edge, kubernetes.io/arch: amd64 }
      tolerations:
        - { key: role, operator: Equal, value: edge, effect: NoSchedule }
      containers:
        - name: collections-tree-app
          image: harbor.lan.e-dani.com/homelab/shopify-collections-tree-app:k8s-20260522-8305a3a-proddeps@sha256:63a776f4af3947e88ba695490cf66440b596265abbc3f4772937c57c97f28cfa
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3473 }]
          env:
            - { name: PORT, value: "3473" }
            - { name: NODE_ENV, value: "production" }
            - { name: DEV_MODE, value: "" }
            - { name: LIVE_BRAIN, value: "" }
            - { name: LIVE_SHOPIFY_WRITES, value: "" }
            - { name: SHOPIFY_APP_URL, value: "https://skirmshop.e-dani.com/collections-tree" }
            - { name: STOREFRONT_DOMAIN, value: "www.skirmshop.es" }
            - { name: BRAIN_URL, value: "http://skirmshop-brain.skirmshop-brain-prod.svc.cluster.local" }
            - { name: LLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000/v1" }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/collections_tree" }
            - name: _RMQUSER
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: _RMQPASS
              valueFrom: { secretKeyRef: { name: rabbitmq-secrets, key: RABBITMQ_DEFAULT_PASS } }
            - { name: SYNAPSE_AMQP_URL, value: "amqp://$(_RMQUSER):$(_RMQPASS)@shared-rabbitmq.databases.svc.cluster.local:5672/%2Fsynapse" }
            - { name: SYNAPSE_TENANT, value: "skirmshop" }
            - { name: SYNAPSE_EVENTS_EXCHANGE, value: "events" }
          envFrom:
            - secretRef: { name: collections-tree-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 3473 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3473 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: collections-tree-app
  namespace: skirmshop
spec:
  selector: { app: collections-tree-app }
  ports: [{ name: http, port: 80, targetPort: 3473 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmshop-collections-tree-public
  namespace: skirmshop
  annotations:
    external-dns.alpha.kubernetes.io/hostname: skirmshop.e-dani.com
    external-dns.alpha.kubernetes.io/target: "57.129.17.172"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    - match: Host(`skirmshop.e-dani.com`) && PathPrefix(`/collections-tree`)
      kind: Rule
      priority: 200
      services:
        - name: collections-tree-app
          port: 80
  tls:
    store: { name: default, namespace: traefik-edge }
